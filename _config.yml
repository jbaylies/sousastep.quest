# Permalinks
#
#
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty
relative_permalinks: false

# Setup
title: John Baylies
tagline: freelance musician & audio technician
description: "John Baylies — freelance musician & audio technician. Dubstep on sousaphone with a game controller: shows, recordings, and the SousaFX software."
url: https://www.sousastep.quest
paginate: 1
baseurl: ""
permalink: pretty
highlighter: rouge

# Default social/SEO card image for all pages and posts (jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: /images/sousastep-og.png

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md

# Assets
#
# We specify the directory for Jekyll so we can use @imports.
sass:
  sass_dir:          _sass
  style:            :compressed

# About/contact
author:
  name:              John Baylies
  url:               https://www.instagram.com/sousasteps/
  email:             

# Custom vars
version:             2.0.0
github:
  repo:              https://github.com/jbaylies/sousastep.quest/
