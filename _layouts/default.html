<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="theme-base-0d sidebar-overlay{% if page.url == '/links/' %} page-links{% endif %}">

    {% include sidebar.html %}

    {% if page.background_shader %}
    <!-- Subtle animated background (SousaVFX phyllotaxis voronoi). Fixed, behind content.
         Rendered by public/js/vfx.js: the static voronoi index map is precomputed once
         into a texture, then a cheap per-frame pass colors it at device-pixel resolution.
         The old shadify setup rendered at half res and showed blocky integer-scale upscaling. -->
    <div class="vfx-background" aria-hidden="true" data-shader="{{ site.baseurl }}/public/shaders/sousavfx-voronoi.frag" data-shader-speed="0.5" data-shader-z-index="-1"></div>
    {% endif %}

    <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <h3 class="masthead-title">
            <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
          </h3>
        </div>
      </div>

      <div class="container content">
        {{ content }}
      </div>
    </div>

    <label for="sidebar-checkbox" class="sidebar-toggle"></label>

    <script src='{{ site.baseurl }}/public/js/script.js'></script>
    {% if page.background_shader %}
    <script src='{{ site.baseurl }}/public/js/vfx.js'></script>
    {% endif %}
  </body>
</html>
